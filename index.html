<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitWin">
<meta name="description" content="FitWin — your personal workout tracker with nutrition guidance. Offline, installable.">
<title>FitWin</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════ -->
<!-- REGISTRATION VIEW                                   -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="view" id="viewRegister">
  <!-- populated by profile.js -->
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- HOME VIEW                                           -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="view" id="viewHome">
  <div class="home-header">
    <div class="home-gym-label" id="homeGymLabel">⚡ Powerhouse Gym · South Lyon</div>
    <div class="home-title">FitWin</div>
    <div class="home-sub" id="homeGreeting">Pick a workout and let's go.</div>
  </div>

  <div class="tile-stack">
    <button class="loc-tile tile-gym" id="gymBtn">
      <span class="tile-text">
        <span class="tile-title">I'm at Gym</span>
        <span class="tile-sub">Machines & free weights</span>
      </span>
      <span class="tile-arrow">›</span>
    </button>
    <button class="loc-tile tile-home" id="homeBtn">
      <span class="tile-text">
        <span class="tile-title">I'm at Home</span>
        <span class="tile-sub">Bodyweight & minimal gear</span>
      </span>
      <span class="tile-arrow">›</span>
    </button>
    <button class="loc-tile tile-outdoor" id="outdoorBtn">
      <span class="tile-text">
        <span class="tile-title">I'm Outdoors</span>
        <span class="tile-sub">Run, park & fresh air</span>
      </span>
      <span class="tile-arrow">›</span>
    </button>
  </div>

  <button class="browse-toggle" id="browseToggle">Browse All Workouts ▾</button>
  <div class="workout-list hidden" id="workoutList"></div>
  <div style="height:16px"></div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- WORKOUT VIEW                                        -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="view" id="viewWorkout">
  <!-- populated by workout.js -->
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- HISTORY VIEW                                        -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="view" id="viewHistory">
  <div class="home-header">
    <div class="home-gym-label">⚡ FitWin</div>
    <div class="home-title">History</div>
    <div class="home-sub">Your completed sessions.</div>
  </div>
  <div class="section-heading">Past Workouts</div>
  <div id="historyList" class="history-list"></div>
  <div style="height:16px"></div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- PROFILE VIEW                                        -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="view" id="viewProfile">
  <!-- populated by app.js / profile.js -->
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- BOTTOM NAV                                          -->
<!-- ═══════════════════════════════════════════════════ -->
<nav class="nav-bar" id="navBar">
  <button class="nav-btn active" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Home
  </button>
  <button class="nav-btn" data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
    History
  </button>
  <button class="nav-btn" data-view="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    Profile
  </button>
</nav>

<!-- ═══════════════════════════════════════════════════ -->
<!-- GYM PICKER BOTTOM SHEET                            -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
<div class="gym-sheet hidden" id="gymSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Today's Smart Pick</div>
    <button class="sheet-close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-reason" id="sheetReason"></div>
  <div class="sheet-workout-card" id="sheetWorkoutCard"></div>
  <div class="sheet-actions">
    <button class="sheet-go-btn" id="sheetGoBtn">Let's Go →</button>
    <button class="sheet-alt-btn" id="sheetAltBtn">Pick Different</button>
  </div>
  <div style="height: env(safe-area-inset-bottom, 8px)"></div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- WEIGHT INPUT MODAL                                  -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="weight-modal hidden" id="weightModal">
  <div class="weight-modal-content">
    <div class="weight-modal-title">Log Weight</div>
    <div class="weight-modal-ex" id="weightModalEx"></div>
    <div class="weight-modal-set" id="weightModalSet"></div>
    <div class="weight-modal-last" id="weightModalLast"></div>
    <input type="number" class="weight-input" id="weightInput" placeholder="Weight (lbs)" step="2.5" min="0">
    <div class="weight-modal-actions">
      <button class="weight-skip" id="weightSkip">Skip</button>
      <button class="weight-save" id="weightSave">Save</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- COMING SOON TOAST                                   -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="soon-toast hidden" id="soonToast"></div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- WATER REMINDER TOAST                                -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="water-toast hidden" id="waterToast">
  <span class="water-icon">💧</span>
  <span class="water-text">Time for a sip of water!</span>
  <button class="water-dismiss" id="waterDismiss">OK</button>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- PWA INSTALL PROMPT                                  -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="install-prompt hidden" id="installPrompt">
  <div class="install-text">
    <strong>Add to Home Screen</strong>
    Install for full-screen offline access.
  </div>
  <button class="install-yes" id="installYes">Install</button>
  <button class="install-dismiss" id="installDismiss">✕</button>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
